services:
  priceit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: priceit
    restart: unless-stopped
    ports:
      - "127.0.0.1:28085:28085"
    environment:
      - NODE_ENV=production
      - PORT=28085
      - DATABASE_PATH=/app/data/priceit.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:28085/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
